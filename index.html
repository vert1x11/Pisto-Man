<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pisto-Man</title>
<meta name="description" content="Inventario y ventas de Pisto-Man">
<meta name="theme-color" content="#1b6a61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pisto-Man">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="pm-db.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: app de una columna (máx. 760px) — barra de marca arriba, pestañas fijas abajo, formularios en hojas que suben desde abajo */
:root{
  --bg:#edf1ef; --surface:#ffffff; --surface-2:#f4f7f6; --ink:#13201e; --muted:#586764; --line:#d4dcd9;
  --agave:#1b6a61; --agave-ink:#ffffff; --agave-soft:#d9e9e5;
  --amber:#9e5b0a; --amber-soft:#f6e9d4;
  --ok:#2a7748; --ok-soft:#dcefe3; --warn:#8f620d; --warn-soft:#f5ebd0; --bad:#ab3328; --bad-soft:#f6dedb;
  --scrim:rgba(12,22,20,.46); --shadow:0 1px 2px rgba(19,32,30,.06),0 6px 18px rgba(19,32,30,.08);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --surface:#162120; --surface-2:#1c2927; --ink:#e5edeb; --muted:#93a39f; --line:#2b3937;
    --agave:#5bbcae; --agave-ink:#05201c; --agave-soft:#1b3431;
    --amber:#e8a650; --amber-soft:#33291a;
    --ok:#66c992; --ok-soft:#163226; --warn:#e4b856; --warn-soft:#342b15; --bad:#f2806f; --bad-soft:#3b201c;
    --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface-2:#1c2927; --ink:#e5edeb; --muted:#93a39f; --line:#2b3937;
  --agave:#5bbcae; --agave-ink:#05201c; --agave-soft:#1b3431;
  --amber:#e8a650; --amber-soft:#33291a;
  --ok:#66c992; --ok-soft:#163226; --warn:#e4b856; --warn-soft:#342b15; --bad:#f2806f; --bad-soft:#3b201c;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--agave);outline-offset:2px}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:11px}
.mark{width:46px;height:46px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);flex:none;overflow:hidden;display:block}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--f-display);font-weight:850;font-stretch:68%;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted)}
.top-date{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.top-date b{display:block;color:var(--ink);font-weight:700;font-size:13px;text-transform:capitalize}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}

/* contenido */
.app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:24px}
.block{display:flex;flex-direction:column;gap:10px;min-width:0}
.h2{font-family:var(--f-display);font-stretch:74%;font-weight:800;font-size:27px;line-height:1.05;margin:0;text-wrap:balance}
.h3{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:19px;line-height:1.1;margin:0}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
.sub{font-size:12.5px;color:var(--muted);font-weight:500}
.money{font-family:var(--f-display);font-stretch:78%;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
.num{font-variant-numeric:tabular-nums}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* resumen del día */
.hero{background:var(--agave);color:var(--agave-ink);border-radius:18px;padding:18px 18px 16px;display:grid;gap:4px}
.hero .lbl{color:inherit;opacity:.8}
.hero .amt{font-family:var(--f-display);font-stretch:72%;font-weight:850;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.hero .meta{font-size:14px;opacity:.9}
.hero .hsep{border-top:1.5px dashed currentColor;opacity:.35;margin:10px 0 8px}

/* botones */
.btn{appearance:none;border:0;border-radius:12px;background:var(--agave);color:var(--agave-ink);font-weight:700;padding:11px 16px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.ghost{background:var(--surface);color:var(--agave);border:1.5px solid var(--line)}
.btn.money-btn{background:var(--amber);color:var(--surface)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 160px}
body.busy .btn,body.busy .pbtn{pointer-events:none;opacity:.6}

/* segmentos */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:650;cursor:pointer;min-height:40px}
.segb.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* campos */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;min-height:44px;width:100%;font:inherit}
.field textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.row2{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--agave)}

/* botones de producto */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.pbtn{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:92px;min-width:0}
.pbtn:active{transform:scale(.98)}
.pbtn .pn{font-weight:750;line-height:1.2}
.pbtn .q{font-size:12px;color:var(--muted)}
.pbtn .q.bad{color:var(--bad);font-weight:650}
.pbtn .pr{margin-top:auto;padding-top:4px;font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:19px;color:var(--amber);font-variant-numeric:tabular-nums}
.pbtn.promo{border-color:transparent;background:var(--amber-soft)}
.pbtn.pcard{cursor:default}
.pbtn.pcard:active{transform:none}
.pb2{margin-top:auto;padding-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pb2b{appearance:none;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;font-size:12px;font-weight:650;color:var(--muted);text-align:left;min-width:0}
.pb2b:active{transform:scale(.97)}
.pb2b b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:16px;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1.1}
body.busy .pb2b{pointer-events:none}

/* ticket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.tl{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.tl-name{min-width:0;font-weight:750;display:flex;flex-direction:column}
.tl-ctrls{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.step button{width:38px;height:38px;border:0;background:var(--surface-2);color:var(--ink);font-size:20px;cursor:pointer;line-height:1}
.step input{width:46px;height:38px;border:0;text-align:center;font:inherit;font-weight:750;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.tl-price{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;height:41px;color:var(--muted)}
.tl-price input{width:70px;border:0;font:inherit;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;outline:none}
.tl-price:focus-within{border-color:var(--agave);box-shadow:0 0 0 2px var(--agave-soft)}
.tl-sub{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.mini{appearance:none;border:1.5px dashed var(--line);background:none;border-radius:10px;padding:0 10px;height:41px;font-size:13px;font-weight:650;color:var(--agave);cursor:pointer}
.x{appearance:none;border:0;background:var(--surface-2);color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1}
.total-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total-row .money{font-size:36px}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.aviso ul{margin:4px 0 0;padding-left:18px}

/* tarjetas de vendedor */
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.vcard{display:flex;flex-direction:column;gap:10px}
.vc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.vc-money{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.vc-money .money{font-size:26px}
.vcard > .btn{align-self:flex-start}
.field > .tl-price{align-self:flex-start}
.tl-price input#v-envio{width:90px}
.warnc{color:var(--warn);font-weight:700}
.badc{color:var(--bad)}
.hero .meta b{font-weight:800}
.gbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.gbar i{display:block;height:100%}
.gm{background:var(--agave)} .gy{background:var(--amber)} .ge{background:var(--muted)}
.gleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);font-weight:600}
.gleg span{display:inline-flex;align-items:center;gap:6px}
.gleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
#m-costo{width:110px}
#g-monto,#m-envio{width:100px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:5px;align-items:baseline;padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;line-height:1.25}
.chip b{font-variant-numeric:tabular-nums;font-weight:800}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill{display:inline-block;font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--muted)} .pill.propio{background:var(--warn-soft);color:var(--warn)}

/* listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.irow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.grow > .sub{display:block}
.seg.compact .segb{padding:7px 11px}
.seg.per{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.per .segb{padding:7px 6px}
@media (min-width:600px){ .seg.per{display:flex;flex-wrap:wrap} .seg.per .segb{padding:7px 14px} }
.pn{font-weight:750;display:block;line-height:1.25}
.bign{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;text-align:right;display:block;line-height:1}
.irow .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bar{height:8px;border-radius:4px;background:var(--agave-soft);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--agave);border-radius:4px}

/* tabla de inventario */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table.inv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:420px}
.inv th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:650;white-space:nowrap}
.inv th:first-child,.inv td:first-child{text-align:left}
.inv td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.inv tr:last-child td{border-bottom:0}
.inv .n{font-weight:800;font-size:17px;display:block}
.inv .n.bad{color:var(--bad)}
.inv td .sub{display:block}
.inv td.tot{background:var(--surface-2)}
.totals{display:flex;flex-wrap:wrap;gap:8px 18px}
.totals div{display:flex;flex-direction:column}
.totals b{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}

/* historial */
.daynav{display:flex;gap:8px;align-items:center}
.daynav .field{flex:1}
.iconbtn{appearance:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;flex:none}
.vrow{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.vrow:last-child{border-bottom:0}
.vrow-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vrow-top .money{margin-left:auto;font-size:21px}
.vlines{font-size:14px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:var(--bad)}
.linkbtn{appearance:none;border:0;background:none;color:var(--muted);font-size:13px;font-weight:650;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px;justify-self:start}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.split{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.vcuenta{background:var(--surface-2);border-radius:12px;padding:8px 12px 10px;display:flex;flex-direction:column}
.vcuenta .kv.tot{border-bottom:0;border-top:1.5px solid var(--ink);margin-top:2px;padding-top:8px;font-size:16px;font-weight:800}
.vcuenta .sub{margin-top:4px}

/* catálogo */
.crow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow.off{opacity:.55}

/* vacío */
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:20px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty b{color:var(--ink);font-size:16px}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font-size:11px;font-stretch:84%;white-space:nowrap;overflow:hidden;font-weight:650;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--agave)}
.tab.on svg{stroke-width:2.3}

/* hoja inferior */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-actions{position:sticky;bottom:0;background:var(--bg);padding-top:10px;display:flex;gap:8px}
.sheet-actions .btn{flex:1}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ins{display:flex;gap:6px}
.mrow .ins label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.mrow .ins input{width:66px;height:42px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-align:center;font:inherit;font-weight:700;font-variant-numeric:tabular-nums}

/* aviso flotante */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:650;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-size:14px}
.toast.bad{background:var(--bad);color:var(--surface)}

@media (min-width:640px){
  .cards{grid-template-columns:1fr 1fr}
  .cards .vcard.wide{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){ .sheet{animation:none} .pbtn:active{transform:none} }

[hidden]{display:none!important}
/* entrar, pasar datos y acceso de repartidores */
body.sin-sesion .tabs{display:none}
.login{display:flex;flex-direction:column;gap:14px;max-width:420px}

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const view = document.getElementById('view');
const sheetWrap = document.getElementById('sheetwrap');
const sheetEl = document.getElementById('sheet');

/* ---------- utilidades ---------- */
const moneyFmt = new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const fmt$ = n => moneyFmt.format(Math.round(Number(n)||0));
const pad = n => String(n).padStart(2,'0');
function hoyStr(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function aFecha(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDias(s,n){ const d=aFecha(s); d.setDate(d.getDate()+n); return hoyStr(d); }
function diaLargo(s){ return aFecha(s).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}); }
function diaCorto(s){ return aFecha(s).toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'}); }
function horaDe(iso){ try{ return new Date(iso).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function mesLargo(ym){ const p=ym.split('-').map(Number); return new Date(p[0],p[1]-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'}); }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => (p||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const lista = o => Object.values(o||{}).filter(Boolean);
const sumaObj = o => Object.values(o||{}).reduce((s,n)=>s+(Number(n)||0),0);
const num = v => { const n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:0; };
const plural = (n,a,b) => n===1?a:b;

/* ---------- estado ---------- */
const S = {
  db:null, estado:'cargando', soloLectura:false, ocupado:false,
  user:null, users:{}, cat:{}, absorbiendo:{}, pendRep:[], loginErr:'', registrar:false, imp:null, online:navigator.onLine,
  prods:{}, promos:{}, ubic:{}, cargado:{prods:false,promos:false,ubic:false,cat:false},
  hoy:hoyStr(), diaHoy:null, histDia:hoyStr(), diaHist:null,
  tab:'hoy', invLoc:'todo', histVend:'todos', confirmar:null, mes:null, gPer:'mes', gDocs:null, gKey:null,
  venta:{vend:'bodega', modo:'menudeo', dia:hoyStr(), lineas:[], nota:'', envio:0, viaje:0, cobro:'rep'},
  sheet:null, pendiente:false
};
try{ const t=localStorage.getItem('pm-tab'); if(t && ['hoy','vender','inv','gan','hist','cat'].includes(t)) S.tab=t; }catch(e){}

/* ---------- catálogo ---------- */
const CAT_ORDEN = {tequila:0, refresco:1, otro:2};
const ordenar = (a,b) => (CAT_ORDEN[a.categoria]??3)-(CAT_ORDEN[b.categoria]??3) || (a.orden??0)-(b.orden??0) || String(a.nombre).localeCompare(String(b.nombre));
const prodsTodos = () => Object.values(S.prods).sort(ordenar);
const prodsActivos = () => prodsTodos().filter(p=>p.activo!==false);
const promosTodas = () => Object.values(S.promos).sort((a,b)=>(a.orden??0)-(b.orden??0) || String(a.nombre).localeCompare(String(b.nombre)));
const promosActivas = () => promosTodas().filter(k=>k.activo!==false);
const ubicTodas = () => Object.values(S.ubic).sort((a,b)=>(a.orden??0)-(b.orden??0));
const ubicActivas = () => ubicTodas().filter(u=>u.activo!==false);
const idBodega = () => (ubicTodas().find(u=>u.tipo==='bodega')||{id:'bodega'}).id;
const nombreVend = id => S.ubic[id] ? S.ubic[id].nombre : 'Vendedor';
const nombreLoc = id => { const u=S.ubic[id]; if(!u) return '—'; return u.tipo==='bodega' ? 'Bodega' : u.nombre; };
const stockDe = (loc,pid) => Number((S.ubic[loc] && S.ubic[loc].stock && S.ubic[loc].stock[pid]) || 0);
const nombreProd = pid => { const p=S.prods[pid]; return p ? p.nombre + (p.presentacion ? ' '+p.presentacion : '') : 'Producto borrado'; };
const porCaja = p => Math.max(0, Math.round(Number(p && p.porCaja) || 0));
const minimo = p => { const m=Number(p && p.minimo); return isFinite(m) && m>0 ? m : 0; };
function unidad(p,n){ const c=p&&p.categoria; if(c==='tequila') return plural(n,'botella','botellas'); if(c==='refresco') return plural(n,'refresco','refrescos'); return plural(n,'pieza','piezas'); }
function cajasTxt(n,p){
  const pc=porCaja(p);
  if(n<0) return 'faltan '+(-n);
  if(pc<=1 || n<pc) return '';
  const c=Math.floor(n/pc), s=n%pc;
  return c+' '+plural(c,'caja','cajas')+(s?' + '+s:'');
}
function precioPara(p){ return Number(p&&p.precio)||0; }
const tieneCaja = p => porCaja(p)>1 && Number(p&&p.precioCaja)>0;
function precioCajaPara(p,cajas){ const base=Number(p&&p.precioCaja)||0, desde=Math.round(Number(p&&p.cajaDesde)||0), d=Number(p&&p.precioCajaDesde)||0; return (desde>1 && d>0 && cajas>=desde) ? d : base; }
function tierTxt(p){ const desde=Math.round(Number(p&&p.cajaDesde)||0), d=Number(p&&p.precioCajaDesde)||0; return desde>1 && d>0 ? 'Desde '+desde+' cajas: '+fmt$(d)+' c/u' : ''; }
function nombreLinea(l){ if(l.t==='k') return (S.promos[l.id]&&S.promos[l.id].nombre)||'Promo'; if(l.t==='r') return nombreProd(l.id)+' de regalo'; if(l.t==='c') return 'Caja de '+porCaja(S.prods[l.id])+' · '+nombreProd(l.id); return nombreProd(l.id); }
function detCaja(l){ const p=S.prods[l.id], n=(Number(l.cant)||0)*(porCaja(p)||1); return '= '+n+' '+unidad(p,n)+(tierTxt(p)?' · '+tierTxt(p):''); }
const ventaPorCaja = (p,modo) => tieneCaja(p) && (modo==='mayoreo' || !!(p&&p.soloCaja));
function ajenoDe(lineas){
  const det={}; let tot=0;
  for(const l of lineas){
    if(l.t!=='k') continue;
    const k=S.promos[l.id], a=Number(k&&k.ajeno)||0, n=Math.round(Number(l.cant)||0);
    if(a>0 && n>0){ const q=String(k.ajenoDe||'').trim()||'tu amigo'; det[q]=(det[q]||0)+a*n; tot+=a*n; }
  }
  return {tot,det};
}
/* repartidor que cobra por viaje (Yahir): no gana comisión; en cada venta se anota el viaje y el envío que paga el cliente (todo el envío es de él) */
const pagaViaje = u => !!(u && u.pago==='viaje');
const esViaje = v => !!(v && v.pagoRep==='viaje');
const netoDe = v => esViaje(v) ? (Number(v.total)||0)-(Number(v.envio)||0)-(Number(v.ajeno)||0) : (v.debe!=null ? (Number(v.debe)||0) : (Number(v.total)||0)) - (Number(v.ajeno)||0);
const ganaDe = v => esViaje(v) ? (Number(v.viaje)||0)+(Number(v.envio)||0) : v.debe!=null ? (Number(v.total)||0) - (Number(v.debe)||0) : 0;
const esRep = id => !!(S.ubic[id] && S.ubic[id].tipo==='rep');
const tieneAcuerdo = u => !!(u && u.comision && typeof u.comision==='object');
const comDe = (rep,pid) => { const u=S.ubic[rep]; return Number(u && u.comision && u.comision[pid]) || 0; };
function calcRep(rep, lineas){
  let debe=0;
  const det=lineas.map(l=>{
    const n=Math.round(Number(l.cant)||0); let lista=0, com=0;
    if(l.t==='p'){ lista=Number(S.prods[l.id]&&S.prods[l.id].precio)||0; com=comDe(rep,l.id); }
    else if(l.t==='k'){ const k=S.promos[l.id]||{}; lista=Number(k.precio)||0; for(const pid in (k.items||{})) com+=Math.round(Number(k.items[pid])||0)*comDe(rep,pid); }
    else { lista=Number(l.precio)||0; }
    debe+=n*Math.max(0, lista-com);
    return {lista, com};
  });
  const total=lineas.reduce((s,l)=>s+(Number(l.cant)||0)*(Number(l.precio)||0),0);
  return {debe, gana: total-debe, det};
}
async function ajustarSaldo(rep, delta){
  if(!delta || !S.ubic[rep]) return;
  await S.db.doc('ubicaciones/'+rep).update({saldo: S.db.inc(Math.round(delta*100)/100)});
}
function calcVenta(vend, lineas, envio, viaje, cobro){
  envio=Math.max(0, Number(envio)||0);
  const prod=lineas.reduce((s,l)=>s+(Number(l.cant)||0)*(Number(l.precio)||0),0), total=prod+envio;
  if(!esRep(vend)) return {rep:false, prod, envio, total};
  if(pagaViaje(S.ubic[vend])){
    const vj=Math.max(0, Number(viaje)||0), quien=cobro==='dueno'?'dueno':'rep';
    /* si cobró él: te debe los productos menos el viaje (el envío se lo queda). Si te pagaron a ti: le debes el viaje y el envío */
    const debe = quien==='rep' ? prod-vj : -(envio+vj);
    return {rep:true, porViaje:true, prod, envio, total, viaje:vj, cobro:quien, debe, gana:envio+vj, envioSuyo:true, det:lineas.map(l=>({lista:Number(l.precio)||0, com:0}))};
  }
  const r=calcRep(vend, lineas), suyo=!!(S.ubic[vend] && S.ubic[vend].envioSuyo);
  const debe=r.debe+(suyo?0:envio);
  return {rep:true, prod, envio, total, debe, gana:total-debe, det:r.det, envioSuyo:suyo};
}
const esTarde = () => { const h=new Date().getHours(); return h>=22 || h<6; };
function envioHint(vend){
  const u=S.ubic[vend];
  const deQuien = esRep(vend) ? (u.envioSuyo ? 'El envío es de '+esc(u.nombre)+', no te lo debe.' : 'El envío es tuyo, se suma a lo que te debe.') : 'El envío es tuyo.';
  return esTarde() ? `<span class="warnc">Ya pasan de las 10 de la noche: ¿se cobró envío?</span> ${deQuien}` : deQuien+' Se cobra después de las 10 de la noche.';
}
function enviosHtml(ventas){ const o={}; ventas.forEach(v=>{ const e=Number(v.envio)||0; if(e>0) o[v.vend]=(o[v.vend]||0)+e; }); const e=Object.entries(o); if(!e.length) return ''; return `<div class="lbl" style="margin-top:10px">Envíos cobrados</div>`+e.map(x=>`<div class="kv"><span>${esc(nombreVend(x[0]))}${esRep(x[0])&&S.ubic[x[0]].envioSuyo?' <span class="sub">(son de él)</span>':esRep(x[0])&&pagaViaje(S.ubic[x[0]])?' <span class="sub">(son de él)</span>':''}</span><b>${fmt$(x[1])}</b></div>`).join(''); }
/* costos y ganancia (el costo se toma del Catálogo actual) */
const fmt2 = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(n)||0);
function costoUnitP(p){ const c=Number(p&&p.costoCaja)||0, n=Math.round(Number(p&&p.piezasCompra)||0); return c>0&&n>0 ? c/n : 0; }
const costoUnit = pid => costoUnitP(S.prods[pid]);
const tieneCosto = p => costoUnitP(p)>0;
const piezasLinea = l => piezasDe([l]);
function ajenoLinea(l){ if(l.t!=='k') return 0; const k=S.promos[l.id]; return (Number(k&&k.ajeno)||0)*Math.round(Number(l.cant)||0); }
function costoEntrada(cant){ let c=0; for(const pid in cant) if(cant[pid]>0) c+=cant[pid]*costoUnit(pid); return c; }
function desglose(v){
  const r={men:{ing:0,cos:0}, may:{ing:0,cos:0}, env:0, viaje:esViaje(v)?(Number(v.viaje)||0):0, faltaCosto:{}};
  const rep=v.debe!=null; let viejo=false;
  (v.lineas||[]).forEach(l=>{
    const g = l.t==='c' ? r.may : r.men;
    let ing=l.ingreso;
    if(ing==null){ viejo=true; const n=Math.round(Number(l.cant)||0); ing = rep && l.lista!=null ? n*Math.max(0,(Number(l.lista)||0)-(Number(l.com)||0)) : n*(Number(l.precio)||0); }
    const pz=piezasLinea(l); let cos=0;
    for(const pid in pz){ const p=S.prods[pid], cu=(l.cu!=null && pid===l.id) ? (Number(l.cu)||0) : costoUnit(pid); if(cu>0) cos+=pz[pid]*cu; else if(p && p.enVenta!==false) r.faltaCosto[pid]=true; }
    g.ing+=Number(ing)||0; g.cos+=cos;
  });
  if(viejo) r.men.ing-=Number(v.ajeno)||0;
  r.env = v.envioTuyo!=null ? (Number(v.envioTuyo)||0) : (rep ? (v.envioSuyo?0:(Number(v.envio)||0)) : (Number(v.envio)||0));
  return r;
}
const ganDe = v => { const d=desglose(v); return d.men.ing-d.men.cos+d.may.ing-d.may.cos+d.env-d.viaje; };
function comResumen(u){ const e=Object.entries((u&&u.comision)||{}).filter(x=>Number(x[1])>0); return e.length ? 'Gana: '+e.map(x=>nombreProd(x[0])+' '+fmt$(x[1])).join(' · ') : 'No gana comisión'; }
function metaHoy(ventas,cobrado,aj){ const parts=['Se cobró '+fmt$(cobrado)]; const g=ventas.reduce((s,v)=>s+ganaDe(v),0); if(g) parts.push(fmt$(g)+' para repartidores'); const t=ajenoTxt(aj); if(t) parts.push(t); return parts.join(' · '); }
function ganaHtml(ventas){ const o={}; ventas.forEach(v=>{ if(v.debe!=null) o[v.vend]=(o[v.vend]||0)+ganaDe(v); }); const e=Object.entries(o); if(!e.length) return ''; return `<div class="lbl" style="margin-top:10px">Ganan repartidores</div>`+e.map(x=>`<div class="kv"><span>${esc(nombreVend(x[0]))}</span><b>${fmt$(x[1])}</b></div>`).join(''); }
function cobroTxt(v){
  const rep=v.debe!=null, aj=Number(v.ajeno)>0; if(!rep && !aj) return '';
  if(v.paraSi) return 'Botella para '+esc(v.vendNombre||nombreVend(v.vend))+' a precio especial · sin comisión · te debe '+fmt$(v.debe);
  if(esViaje(v)){
    const nm=esc(v.vendNombre||nombreVend(v.vend)), d=Number(v.debe)||0;
    const p=[v.cobro==='dueno' ? 'Te pagaron a ti '+fmt$(v.total) : nm+' cobró '+fmt$(v.total), 'viaje '+fmt$(v.viaje)];
    if(Number(v.envio)>0) p.push('envío '+fmt$(v.envio)+' para '+nm);
    p.push(d>=0 ? 'te debe '+fmt$(d) : 'le debes '+fmt$(-d));
    if(aj) p.push(ajenoTxt(v.ajenoDetalle));
    return p.join(' · ');
  }
  const parts=['Se cobró '+fmt$(v.total)];
  if(rep){ const nm=esc(v.vendNombre||nombreVend(v.vend)); parts.push(nm+' gana '+fmt$(ganaDe(v))); parts.push('te debe '+fmt$(v.debe)); }
  if(aj) parts.push(ajenoTxt(v.ajenoDetalle));
  return parts.join(' · ');
}
function repCard(u, vv, chips){
  const saldo=Number(u.saldo)||0, nm=esc(u.nombre);
  const cob=vv.reduce((s,v)=>s+(Number(v.total)||0),0), gana=vv.reduce((s,v)=>s+ganaDe(v),0), env=vv.reduce((s,v)=>s+(Number(v.envio)||0),0);
  const debHoy=vv.reduce((s,v)=>s+(v.debe!=null?(Number(v.debe)||0):(Number(v.total)||0)),0), aj=sumaAjeno(vv);
  const big = saldo>=0 ? `<span class="lbl">Te debe</span><span class="money">${fmt$(saldo)}</span>` : `<span class="lbl">Le debes</span><span class="money">${fmt$(-saldo)}</span>`;
  const viaje=pagaViaje(u), vjHoy=vv.reduce((s,v)=>s+(esViaje(v)?Number(v.viaje)||0:0),0);
  const hoy = !vv.length ? 'Hoy no tiene ventas.' : viaje
    ? `Hoy: ${vv.length} ${plural(vv.length,'venta','ventas')} · viajes ${fmt$(vjHoy)}${env?' · envíos para él '+fmt$(env):''} · él gana ${fmt$(gana)}`
    : `Hoy: ${vv.length} ${plural(vv.length,'venta','ventas')} · cobró ${fmt$(cob)} · él gana ${fmt$(gana)}${env?' (con '+fmt$(env)+' de envíos)':''} · de hoy te debe ${fmt$(debHoy)}${Object.keys(aj).length?' (de eso '+ajenoTxt(aj)+')':''}`;
  return `<article class="card vcard">
    <div class="vc-head"><div><h3 class="h3">${nm}</h3><span class="sub">${viaje?'Repartidor · le pagas por viaje':'Repartidor'}</span>${tieneAcuerdo(u)||viaje?'':' <span class="pill warn">Faltan sus montos</span>'}</div>
    <div class="vc-money">${big}</div></div>
    <span class="sub">${hoy}</span>
    <button class="btn small ghost" data-a="entrega" data-id="${esc(u.id)}">${viaje?'Anotar pago o dinero':'Anotar dinero que te dio'}</button>
    <div class="lbl">Trae ahorita</div>
    <div class="chips">${chips}</div>
  </article>`;
}
function sumaAjeno(ventas){ const det={}; ventas.forEach(v=>{ const d=v.ajenoDetalle||{}; for(const q in d) det[q]=(det[q]||0)+(Number(d[q])||0); }); return det; }
function ajenoTxt(det){ return Object.entries(det||{}).filter(e=>e[1]>0).map(e=>fmt$(e[1])+' para '+esc(e[0])).join(' · '); }
function ajenoTicket(){
  const v=S.venta, a=ajenoDe(v.lineas);
  if(esRep(v.vend) && pagaViaje(S.ubic[v.vend])){
    if(!a.tot) return '';
    return Object.entries(a.det).map(e=>`<div class="kv"><span>De los productos, para ${esc(e[0])}</span><b>−${fmt$(e[1])}</b></div>`).join('');
  }
  if(esRep(v.vend)){
    const u=S.ubic[v.vend], r=calcVenta(v.vend, v.lineas, v.envio), nm=esc(u.nombre);
    let h=`<div class="kv"><span>${nm} gana${r.envio&&r.envioSuyo?' (con envío)':''}</span><b>${fmt$(r.gana)}</b></div><div class="kv"><span>${nm} te debe</span><b>${fmt$(r.debe)}</b></div>`;
    if(a.tot) h+=Object.entries(a.det).map(e=>`<div class="kv"><span>De eso, para ${esc(e[0])}</span><b>${fmt$(e[1])}</b></div>`).join('')+`<div class="kv"><span>Te queda a ti</span><b>${fmt$(r.debe-a.tot)}</b></div>`;
    if(!tieneAcuerdo(u)) h+=`<div class="aviso">Falta poner cuánto gana ${nm} por botella. Mientras, todo se cuenta como tuyo. Ponlo en Catálogo, en Quién vende.</div>`;
    return h;
  }
  if(!a.tot) return '';
  return Object.entries(a.det).map(e=>`<div class="kv"><span>Para ${esc(e[0])}</span><b>−${fmt$(e[1])}</b></div>`).join('')+`<div class="kv"><span>Te queda a ti</span><b>${fmt$(totalCobrar()-a.tot)}</b></div>`;
}
function reprecio(){ S.venta.lineas.forEach(l=>{ if(l.t==='c' && !l.manual && S.prods[l.id]) l.precio=precioCajaPara(S.prods[l.id], Number(l.cant)||0); }); }
function compTxt(k){
  if(!k) return '';
  const nm=pid=>S.prods[pid]?nombreProd(pid):'?';
  const a=Object.entries(k.items||{}).filter(e=>Number(e[1])>0).map(e=>e[1]+' '+nm(e[0]));
  const b=Object.entries(k.regalo||{}).filter(e=>Number(e[1])>0).map(e=>e[1]+' '+nm(e[0])+' de regalo');
  return a.concat(b).join(' + ');
}
/* todo lo que sale del inventario (incluye regalos) */
function piezasDe(lineas){
  const out={}, add=(pid,q)=>{ if(q>0) out[pid]=(out[pid]||0)+q; };
  for(const l of lineas){
    const n=Math.round(Number(l.cant)||0); if(n<=0) continue;
    if(l.t==='p' || l.t==='r') add(l.id, n);
    else if(l.t==='c') add(l.id, n*(porCaja(S.prods[l.id])||1));
    else { const k=S.promos[l.id]||{}; [k.items||{}, k.regalo||{}].forEach(m=>{ for(const pid in m) add(pid, Math.round(Number(m[pid])||0)*n); }); }
  }
  return out;
}
/* lo que se regaló (sale del inventario pero no cuenta como vendido) */
function regalosDe(lineas){
  const out={}, add=(pid,q)=>{ if(q>0) out[pid]=(out[pid]||0)+q; };
  for(const l of lineas){
    const n=Math.round(Number(l.cant)||0); if(n<=0) continue;
    if(l.t==='r') add(l.id, n);
    else if(l.t==='k'){ const k=S.promos[l.id]||{}; for(const pid in (k.regalo||{})) add(pid, Math.round(Number(k.regalo[pid])||0)*n); }
  }
  return out;
}
function restar(a,b){ const o={}; for(const k in a){ const v=(Number(a[k])||0)-(Number(b[k])||0); if(v>0) o[k]=v; } return o; }
const regalosVenta = v => v.regalos || regalosDe(v.lineas||[]);
const vendidasDe = v => v.regalos ? (v.piezas||{}) : restar(v.piezas||{}, regalosDe(v.lineas||[]));
function regaloBtns(){
  const refs=prodsActivos().filter(p=>p.categoria==='refresco');
  return refs.length ? `<div class="actions">${refs.map(p=>`<button class="mini" data-a="regalo" data-id="${esc(p.id)}">+ ${esc(nombreProd(p.id))} de regalo</button>`).join('')}</div>` : '';
}
function faltantes(loc,pz){ const f=[]; for(const pid in pz){ const hay=stockDe(loc,pid); if(pz[pid]>hay) f.push({pid,hay,pide:pz[pid]}); } return f; }
const totalVenta = () => S.venta.lineas.reduce((s,l)=>s+(Number(l.cant)||0)*(Number(l.precio)||0),0);
const totalCobrar = () => totalVenta() + Math.max(0, Number(S.venta.envio)||0);

function subColeccion(nombre, clave){

/* copia del catálogo SIN costos para la app de repartidores */
const CAMPOS_REP=['nombre','presentacion','categoria','precio','porCaja','soloCaja','enVenta','activo','orden'];
function catRep(p){ return {nombre:String(p.nombre||''), presentacion:String(p.presentacion||''), categoria:String(p.categoria||'otro'), precio:Number(p.precio)||0, porCaja:Number(p.porCaja)||0, soloCaja:!!p.soloCaja, enVenta:p.enVenta!==false, activo:p.activo!==false, orden:Number(p.orden)||0}; }
let syncTimer=null;
function syncCatalogoRep(){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{
    if(!S.db || !S.cargado.prods || !S.cargado.cat || !Object.keys(S.prods).length) return;
    for(const id in S.prods){ const w=catRep(S.prods[id]), h=S.cat[id]; if(!h || CAMPOS_REP.some(k=>h[k]!==w[k])) S.db.doc('catalogoRep/'+id).set(w); }
    for(const id in S.cat){ if(!S.prods[id]) S.db.doc('catalogoRep/'+id).delete(); }
  }, 800);
}
/* ventas que mandan los repartidores desde su app: se pasan a tu historial y se ajusta lo que traen y lo que te deben */
function subRepVentas(){
  unsubs.push(S.db.collection('repVentas').where('absorbida','==',false).onSnapshot(snap=>{
    S.pendRep=snap.docs.map(d=>Object.assign({id:d.id}, d.data())).filter(x=>!x.borrada);
    absorberPendientes();
  }, e=>console.warn('repVentas', e)));
}
function absorberPendientes(){ if(!navigator.onLine) return; S.pendRep.forEach(x=>{ if(!S.absorbiendo[x.id]) absorber(x); }); }
async function absorber(x){
  const fs=PM.db.fs, FV=PM.db.FV, ref=fs.collection('repVentas').doc(x.id);
  S.absorbiendo[x.id]=true;
  try{
    let hecho=null;
    await fs.runTransaction(async tx=>{
      const s=await tx.get(ref); if(!s.exists) return;
      const d=s.data(); if(d.absorbida || d.borrada || !d.venta) return;
      const v=d.venta, loc=d.rep, dia=v.dia||String(v.hora||'').slice(0,10);
      tx.set(fs.collection('dias').doc(dia), {dia, ventas:{[v.id]:PM.db.limpiar(v)}}, {merge:true});
      const st={}, cm=(v.cambios&&v.cambios[loc])||{};
      for(const pid in cm) st[pid]=FV.increment(Number(cm[pid])||0);
      const up={}; if(Object.keys(st).length) up.stock=st; if(v.debe!=null) up.saldo=FV.increment(Math.round((Number(v.debe)||0)*100)/100);
      if(Object.keys(up).length) tx.set(fs.collection('ubicaciones').doc(loc), up, {merge:true});
      tx.update(ref, {absorbida:true, absorbidaEn:FV.serverTimestamp()});
      hecho=v;
    });
    if(hecho) toast((hecho.paraSi?'Botella para ':'Llegó una venta de ')+(hecho.vendNombre||'tu repartidor')+' · te debe '+fmt$(hecho.debe));
  }catch(e){ console.warn('No se pudo pasar la venta del repartidor', e); }
  finally{ delete S.absorbiendo[x.id]; }
}

window.addEventListener('offline', ()=>{ S.online=false; renderTop(); });

const subs={hoy:null,hist:null}, subDiaKey={hoy:null,hist:null};
function subDia(cual){
  if(!S.db) return;
  const dia = cual==='hoy' ? S.hoy : S.histDia;
  if(subDiaKey[cual]===dia) return;
  if(subs[cual]) subs[cual]();
  subDiaKey[cual]=dia;
  if(cual==='hoy') S.diaHoy=null; else S.diaHist=null;
  subs[cual]=S.db.doc('dias/'+dia).onSnapshot(s=>{
    const v = s.exists ? s.data() : {dia, ventas:{}, movs:{}};
    if(cual==='hoy') S.diaHoy=v; else S.diaHist=v;
    pedirRender();
  }, onErr);
}
async function escribirDia(dia, patch){
  await S.db.doc('dias/'+dia).update(Object.assign({dia}, patch));
}
async function aplicar(cambios, signo){
  for(const loc of Object.keys(cambios)){
    const patch={};
    for(const pid of Object.keys(cambios[loc]||{})){ const d=Math.round(signo*Number(cambios[loc][pid]||0)); if(d) patch[pid]=S.db.inc(d); }
    if(Object.keys(patch).length) await S.db.doc('ubicaciones/'+loc).update({stock:patch});
  }
}
async function intentar(fn, okMsg){
  if(!S.db){ toast('No hay conexión con el guardado.','bad'); return false; }
  if(S.ocupado) return false;
  S.ocupado=true; document.body.classList.add('busy');
  try{ await fn(); if(okMsg) toast(okMsg+(navigator.onLine?'':' · se sube cuando vuelva la señal')); return true; }
  catch(e){ console.error(e); toast('No se pudo guardar: '+PM.mensajeError(e),'bad'); return false; }
  finally{ S.ocupado=false; document.body.classList.remove('busy'); }
}

function renderTabs(){ document.querySelectorAll('.tab').forEach(b=>{ const on=b.dataset.tab===S.tab; b.classList.toggle('on',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); }
function render(){
  S.pendiente=false;
  renderTop(); renderTabs();
  let html='';
  if(S.estado==='sin-config') html=vSinConfig();
  else if(S.estado==='login') html=vLogin();

}

/* --- Hoy --- */
function vHoy(){
  const ps=prodsActivos();
  if(!ps.length) return vacioCatalogo();
  const ventas=lista(S.diaHoy&&S.diaHoy.ventas);
  const total=ventas.reduce((s,v)=>s+netoDe(v),0), cobrado=ventas.reduce((s,v)=>s+(Number(v.total)||0),0), ajHoy=sumaAjeno(ventas);
  const piezas=ventas.reduce((s,v)=>s+sumaObj(vendidasDe(v)),0);
  const us=ubicActivas();
  const cards=us.map(u=>{
    const vv=ventas.filter(v=>v.vend===u.id), t=vv.reduce((s,v)=>s+netoDe(v),0), cob=vv.reduce((s,v)=>s+(Number(v.total)||0),0);
    const ajV = cob!==t ? `<span class="sub">Cobró ${fmt$(cob)} · ${ajenoTxt(sumaAjeno(vv))}</span>` : '';
    const chips=ps.map(p=>{
      const n=stockDe(u.id,p.id);
      const cls = n<=0 ? 'chip bad' : (u.tipo==='bodega' && minimo(p) && n<=minimo(p)) ? 'chip warn' : 'chip';
      return `<span class="${cls}"><b>${n}</b>${esc(p.nombre)}${p.presentacion?' '+esc(p.presentacion):''}</span>`;
    }).join('');
    if(u.tipo==='rep') return repCard(u, vv, chips);
    return `<article class="card vcard${u.tipo==='bodega'?' wide':''}">
      <div class="vc-head"><div><h3 class="h3">${esc(u.nombre)}</h3><span class="sub">${u.tipo==='bodega'?'Tú · bodega':'Repartidor'}</span></div>
      <div class="vc-money"><span class="money">${fmt$(t)}</span><span class="sub">${vv.length} ${plural(vv.length,'venta','ventas')} hoy</span>${ajV}</div></div>
      <div class="lbl">${u.tipo==='bodega'?'Queda en bodega':'Trae ahorita'}</div>
      <div class="chips">${chips}</div>
    </article>`;
  }).join('');
  const porProd={}; ventas.forEach(v=>{ const vd=vendidasDe(v); for(const pid in vd) porProd[pid]=(porProd[pid]||0)+Number(vd[pid]||0); });
  const top=Object.entries(porProd).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  const max=top.length?top[0][1]:1;
  const topHtml = top.length ? `<div class="list">${top.map(e=>{ const p=S.prods[e[0]]; return `<div class="irow"><div class="grow"><span class="pn">${esc(nombreProd(e[0]))}</span><div class="bar"><i style="width:${Math.max(4,Math.round(e[1]/max*100))}%"></i></div></div><div class="right"><span class="bign">${e[1]}</span><span class="sub">${unidad(p,e[1])}</span></div></div>`; }).join('')}</div>`
    : `<div class="empty"><span>Cuando registres ventas, aquí verás qué se está vendiendo más hoy.</span></div>`;
  const bod=idBodega();
  const bajos=ps.filter(p=>{ const n=stockDe(bod,p.id); return n<=0 || (minimo(p) && n<=minimo(p)); });
  const bajosHtml = bajos.length ? `<section class="block"><div class="lbl">Por acabarse en bodega</div><div class="list">${bajos.map(p=>{ const n=stockDe(bod,p.id); return `<div class="irow"><div class="grow"><span class="pn">${esc(nombreProd(p.id))}</span><span class="sub">${minimo(p)?'Avisar cuando queden '+minimo(p):'Sin mínimo'}</span></div><span class="pill ${n<=0?'bad':'warn'}">${n<=0?'Agotado':'Quedan '+n}</span></div>`; }).join('')}</div></section>` : '';
  return `
  <section class="hero" aria-label="Resumen de hoy">
    <span class="lbl">Para ti hoy · ${esc(diaLargo(S.hoy))}</span>
    <span class="amt">${fmt$(total)}</span>
    <span class="meta">${ventas.length} ${plural(ventas.length,'venta','ventas')} · ${piezas} ${plural(piezas,'pieza','piezas')} vendidas</span>
    ${cobrado!==total?`<span class="meta">${metaHoy(ventas,cobrado,ajHoy)}</span>`:''}
    ${ventas.length?`<span class="meta">Ganancia de hoy: <b>${fmt$(ventas.reduce((s,v)=>s+ganDe(v),0))}</b> (ya sin lo que te costó la mercancía)</span>`:''}
  </section>
  <button class="btn block money-btn" data-a="tab" data-t="vender">Registrar una venta</button>
  <section class="block"><div class="lbl">Cada quien</div><div class="cards">${cards}</div></section>
  <section class="block"><div class="lbl">Lo más vendido hoy</div>${topHtml}</section>
  ${bajosHtml}`;
}

/* la cuenta con el repartidor que cobra por viaje, para que se vea antes de guardar */
function cuentaViaje(){
  const v=S.venta, nm=esc(nombreVend(v.vend)), c=calcVenta(v.vend, v.lineas, v.envio, v.viaje, v.cobro);
  const filas = c.cobro==='rep'
    ? `<div class="kv"><span>${nm} cobra al cliente</span><b>${fmt$(c.total)}</b></div>
       <div class="kv"><span>Te toca de los productos</span><b>${fmt$(c.prod)}</b></div>
       <div class="kv"><span>− Su viaje</span><b>${fmt$(c.viaje)}</b></div>
       ${c.envio?`<div class="kv"><span>El envío se lo queda él</span><b>${fmt$(c.envio)}</b></div>`:''}`
    : `<div class="kv"><span>Te pagaron a ti</span><b>${fmt$(c.total)}</b></div>
       <div class="kv"><span>Le debes su viaje</span><b>${fmt$(c.viaje)}</b></div>
       ${c.envio?`<div class="kv"><span>+ Le debes el envío</span><b>${fmt$(c.envio)}</b></div>`:''}`;
  const res = c.debe>=0 ? `<div class="kv tot"><span>${nm} te debe</span><b>${fmt$(c.debe)}</b></div>` : `<div class="kv tot"><span>Le debes a ${nm}</span><b>${fmt$(-c.debe)}</b></div>`;
  return `<div class="vcuenta">${filas}${res}<span class="sub">${nm} gana ${fmt$(c.gana)} con esta venta (viaje${c.envio?' + envío':''}).${c.viaje?'':' <span class="warnc">Falta anotar el viaje.</span>'}</span></div>`;
}
function avisoVenta(quien, falt){

function actualizarTotal(){

  v.lineas.forEach((l,i)=>{
    const el=document.getElementById('st-'+i); if(el) el.textContent=fmt$((Number(l.cant)||0)*(Number(l.precio)||0));

function agregarLinea(t,id){
  const v=S.venta; const ex=v.lineas.find(l=>l.t===t && l.id===id);
  if(ex){ ex.cant=(Number(ex.cant)||0)+1; }
  else {
    const precio = t==='p' ? precioPara(S.prods[id]) : t==='c' ? precioCajaPara(S.prods[id],1) : (Number(S.promos[id]&&S.promos[id].precio)||0);
    v.lineas.push({t,id,cant:1,precio,manual:false});
  }
  reprecio(); render();
  const tk=document.querySelector('.ticket'); if(tk && tk.getBoundingClientRect().top<0) tk.scrollIntoView({block:'start',behavior:'smooth'});
}
async function guardarVenta(){
  const v=S.venta;
  const lineas=v.lineas.filter(l=>(Number(l.cant)||0)>0).map(l=>({
    t:l.t, id:l.id, cant:Math.round(Number(l.cant)), precio:Number(l.precio)||0,
    nombre: nombreLinea(l)
  }));
  if(!lineas.length){ toast('Agrega al menos un producto o promo.'); return; }
  const salen=piezasDe(lineas), regalos=regalosDe(lineas), piezas=restar(salen, regalos), cv=calcVenta(v.vend, lineas, v.envio, v.viaje, v.cobro), total=cv.total;
  const cambios={}; cambios[v.vend]={}; for(const pid in salen) cambios[v.vend][pid]=-salen[pid];
  const id=uid('v'), dia=v.dia||S.hoy;
  const aj=ajenoDe(lineas);
  lineas.forEach((l,i)=>{ const d=cv.rep?cv.det[i]:null, base = d ? l.cant*Math.max(0,d.lista-d.com) : l.cant*l.precio; l.ingreso=Math.round((base-ajenoLinea(l))*100)/100; });
  const venta={id, dia, hora:new Date().toISOString(), vend:v.vend, vendNombre:nombreVend(v.vend), modo:v.modo, lineas, total, envio:cv.envio, envioTuyo:(cv.rep&&cv.envioSuyo)?0:cv.envio, ajeno:aj.tot, ajenoDetalle:aj.det, piezas, regalos, cambios, nota:String(v.nota||'').trim()};
  let msg='Venta guardada · '+fmt$(total);
  if(cv.rep){
    cv.det.forEach((d,i)=>{ lineas[i].lista=d.lista; lineas[i].com=d.com; });
    venta.debe=Math.round(cv.debe*100)/100; venta.gana=cv.gana; venta.envioSuyo=cv.envioSuyo;
    if(cv.porViaje){ venta.pagoRep='viaje'; venta.viaje=cv.viaje; venta.cobro=cv.cobro; venta.envioTuyo=0; }
    msg+=' · '+nombreVend(v.vend)+(cv.debe>=0?' te debe '+fmt$(cv.debe):' · le debes '+fmt$(-cv.debe));
  } else if(aj.tot){ msg+=' ('+fmt$(total-aj.tot)+' tuyos)'; }
  const ok=await intentar(async()=>{ await escribirDia(dia,{ventas:{[id]:venta}}); await aplicar(cambios,1); if(venta.debe!=null){ await ajustarSaldo(v.vend, venta.debe); await S.db.doc('repVentas/'+id).set({id, rep:v.vend, dia, hora:venta.hora, venta, absorbida:true, borrada:false, origen:'dueno'}); } }, msg);
  if(ok){ v.lineas=[]; v.nota=''; v.envio=0; v.viaje=0; v.cobro='rep'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}

async function cargarMes(){
  if(!S.db) return;
  const m=S.histDia.slice(0,7);
  try{
    const snap=await S.db.collection('dias').where('dia','>=',m+'-01').where('dia','<=',m+'-31').limit(31).get();
    const r={m,total:0,nVentas:0,dias:0,porVend:{},porProd:{},ajeno:{},gana:{}};
    snap.docs.forEach(doc=>{ const vs=lista(doc.data().ventas); if(vs.length) r.dias++; vs.forEach(v=>{ r.total+=netoDe(v); r.nVentas++; r.porVend[v.vend]=(r.porVend[v.vend]||0)+netoDe(v); if(v.debe!=null) r.gana[v.vend]=(r.gana[v.vend]||0)+ganaDe(v); r.env=(r.env||0)+(Number(v.envio)||0); const ad=v.ajenoDetalle||{}; for(const q in ad) r.ajeno[q]=(r.ajeno[q]||0)+(Number(ad[q])||0); const vd=vendidasDe(v); for(const pid in vd) r.porProd[pid]=(r.porProd[pid]||0)+Number(vd[pid]||0); }); });
    S.mes=r; render();
  }catch(e){ toast('No se pudo cargar el mes. Intenta otra vez.','bad'); }
}
async function borrarVenta(id){

}
async function borrarMov(id){

/* --- Ganancias --- */
function rangoPer(per){
  const hoy=S.hoy, d=aFecha(hoy);
  if(per==='hoy') return [hoy, hoy, 'hoy', 'hoy'];
  if(per==='anio'){ const y=hoy.slice(0,4); return [y+'-01-01', hoy, y, 'en '+y]; }
  if(per==='anioant'){ const y=String(Number(hoy.slice(0,4))-1); return [y+'-01-01', y+'-12-31', y, 'en '+y]; }
  if(per==='7d') return [addDias(hoy,-6), hoy, 'últimos 7 días', 'en los últimos 7 días'];
  if(per==='mes'){ const m=mesLargo(hoy.slice(0,7)); return [hoyStr(new Date(d.getFullYear(),d.getMonth(),1)), hoy, m, 'en '+m]; }
  const a=hoyStr(new Date(d.getFullYear(),d.getMonth()-1,1)), b=hoyStr(new Date(d.getFullYear(),d.getMonth(),0)), m=mesLargo(a.slice(0,7));
  return [a, b, m, 'en '+m];
}
let gUnsub=null;
function subGan(){
  if(!S.db) return;
  const r=rangoPer(S.gPer), key=r[0]+'_'+r[1];
  if(S.gKey===key) return;
  if(gUnsub) gUnsub();
  S.gKey=key; S.gDocs=null;
  gUnsub=S.db.collection('dias').where('dia','>=',r[0]).where('dia','<=',r[1]).limit(400).onSnapshot(snap=>{ S.gDocs=snap.docs.map(x=>x.data()); if(S.tab==='gan') pedirRender(); }, onErr);
}
function valorMercancia(){
  let v=0, falta=false;
  ubicTodas().forEach(u=>{ for(const pid in (u.stock||{})){ const n=Number(u.stock[pid])||0; if(n<=0) continue; const cu=costoUnit(pid); if(cu>0) v+=n*cu; else if(S.prods[pid] && S.prods[pid].enVenta!==false) falta=true; } });
  return {v, falta};
}

  const promoHtml = ks.length ? `<div class="list">${ks.map(k=>`<div class="crow ${k.activo===false?'off':''}"><div class="grow"><span class="pn">${esc(k.nombre)}</span><span class="sub">${esc(compTxt(k))||'Sin productos'}${Number(k.ajeno)>0?' · '+fmt$(k.ajeno)+' para '+esc(k.ajenoDe||'tu amigo'):''}${k.activo===false?' · oculta':''}</span></div><span class="money" style="font-size:19px">${fmt$(k.precio)}</span><button class="btn small ghost" data-a="editk" data-id="${esc(k.id)}">Editar</button></div>`).join('')}</div>` : '<div class="empty"><span>Todavía no hay promos.</span></div>';
  const ubicHtml = `<div class="list">${us.map(u=>`<div class="crow ${u.activo===false?'off':''}"><div class="grow"><span class="pn">${esc(u.nombre)}</span><span class="sub">${u.tipo==='bodega'?'Tú · vende desde bodega':'Repartidor'+(pagaViaje(u)?' · le pagas por viaje':tieneAcuerdo(u)?' · '+esc(comResumen(u)):'')+(propioResumen(u)?' · '+esc(propioResumen(u)):'')+(u.envioSuyo?' · se queda los envíos':'')}${u.activo===false?' · oculto':''}</span></div>${u.tipo==='rep'&&!tieneAcuerdo(u)&&!pagaViaje(u)?'<span class="pill warn">Faltan sus montos</span>':''}<button class="btn small ghost" data-a="editu" data-id="${esc(u.id)}">Editar</button></div>`).join('')}</div>`;

  <section class="block"><div class="head-row"><h3 class="h3">Productos</h3><button class="btn small" data-a="editp" data-id="">Agregar producto</button></div>${prodHtml}</section>
  <section class="block"><div class="head-row"><h3 class="h3">Promos</h3><button class="btn small" data-a="editk" data-id="">Agregar promo</button></div>${promoHtml}</section>

  <section class="block"><h3 class="h3">Tu cuenta</h3><div class="list">
    <div class="irow"><div class="grow"><span class="pn">${esc((S.user&&S.user.email)||'')}</span><span class="sub">Cuenta de dueño</span></div><button class="btn small ghost" data-a="salir">Cerrar sesión</button></div>

async function respaldo(){
  if(S.ocupado) return; S.ocupado=true; document.body.classList.add('busy');
  try{
    const out={app:'pistoman', exportado:new Date().toISOString()};
    for(const c of ['productos','promos','ubicaciones','dias']){ const sn=await PM.db.fs.collection(c).get(); out[c]={}; sn.docs.forEach(d=>{ out[c][d.id]=d.data(); }); }
    const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pistoman-respaldo-'+S.hoy+'.json'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    toast('Respaldo descargado.');
  }catch(e){ toast('No se pudo hacer el respaldo: '+PM.mensajeError(e),'bad'); }
  finally{ S.ocupado=false; document.body.classList.remove('busy'); }
}
async function importar(file){
  const malo=()=>{ S.imp={err:'Ese archivo no es un respaldo de Pisto-Man.'}; render(); };
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ malo(); return; }
  const cols=['productos','promos','ubicaciones','dias'];
  if(!data || !cols.every(c=>data[c] && typeof data[c]==='object')){ malo(); return; }
  if(!navigator.onLine){ S.imp={err:'Necesitas internet para subir tus datos.'}; render(); return; }
  const items=[]; cols.forEach(c=>{ for(const id in data[c]) items.push([c,id,data[c][id]]); });
  for(const id in data.productos) items.push(['catalogoRep', id, catRep(data.productos[id])]);
  S.imp={hechos:0,total:items.length}; render();
  try{
    for(let i=0;i<items.length;i+=400){
      const b=PM.db.fs.batch();
      items.slice(i,i+400).forEach(([c,id,d])=>{ b.set(PM.db.fs.collection(c).doc(id), PM.db.limpiar(d)); });
      await b.commit();
      S.imp.hechos=Math.min(items.length,i+400); render();
    }
    S.imp.fin=true; S.tab='hoy'; render(); toast('Listo, ya están todos tus datos.');
  }catch(e){ S.imp.err='Se cortó la subida: '+PM.mensajeError(e)+' Vuelve a escoger el archivo; no se duplica nada.'; render(); }
}
async function login(reg){
  const email=(document.getElementById('l-email').value||'').trim(), pass=document.getElementById('l-pass').value||'';
  S.loginEmail=email;
  if(!email || !pass){ S.loginErr='Escribe tu correo y tu contraseña.'; render(); return; }
  if(reg){ const p2=(document.getElementById('l-pass2')||{}).value||''; if(p2!==pass){ S.loginErr='Las dos contraseñas no son iguales.'; render(); return; } }
  S.loginErr=''; document.body.classList.add('busy');
  try{ if(reg) await PM.auth.createUserWithEmailAndPassword(email, pass); else await PM.auth.signInWithEmailAndPassword(email, pass); }
  catch(e){ S.loginErr=PM.mensajeError(e); render(); }
  finally{ document.body.classList.remove('busy'); }
}
function olvide(){
  const email=((document.getElementById('l-email')||{}).value||'').trim(); S.loginEmail=email;
  if(!email){ S.loginErr='Escribe tu correo arriba y vuelve a tocar "Se me olvidó la contraseña".'; render(); return; }
  PM.auth.sendPasswordResetEmail(email).then(()=>{ S.loginErr=''; render(); toast('Te mandamos un correo para cambiar tu contraseña.'); }).catch(e=>{ S.loginErr=PM.mensajeError(e); render(); });
}

function renderSheet(){

  const tt=titulos[s.mov];

  const filas=ps.map(p=>{
    const pc=porCaja(p), hay=stockDe(origen,p.id);
    let c='', z='';

    return `<div class="mrow"><div class="grow"><span class="pn">${esc(nombreProd(p.id))}</span><span class="sub">${hint}${pc>1?' · caja de '+pc:''}</span></div><div class="ins">${ins}</div></div>`;
  }).join('');

    <div class="row2"><label class="field"><span class="lbl">Fecha de la compra</span><input type="date" id="m-fecha" value="${esc(S.hoy)}" max="${esc(S.hoy)}"></label>

    <div class="sheet-actions"><button class="btn ghost" data-a="cerrar">Cancelar</button><button class="btn" data-a="guardarmov">Guardar</button></div>`;

function leerCantidades(){
  const out={};
  for(const p of prodsActivos()){
    const ce=document.getElementById('m-c-'+p.id), pe=document.getElementById('m-p-'+p.id);
    if(!ce && !pe) continue;
    const n=Math.round(num(ce?ce.value:0)*(porCaja(p)||1)+num(pe?pe.value:0));
    out[p.id]=n;
  }
  return out;
}
async function guardarMov(){
  const s=S.sheet, loc=s.loc, bod=idBodega(), cant=leerCantidades();
  const nota=(document.getElementById('m-nota')||{}).value||'';
  const cambios={}, piezas={}; let de=null, a=loc;
  if(s.mov==='conteo'){
    for(const pid in cant){ const d=cant[pid]-stockDe(loc,pid); if(d){ cambios[loc]=cambios[loc]||{}; cambios[loc][pid]=d; } }
    if(!cambios[loc]){ toast('No hay diferencias. El inventario ya está bien.'); cerrarSheet(); return; }
  } else {
    for(const pid in cant) if(cant[pid]>0) piezas[pid]=cant[pid];
    if(!Object.keys(piezas).length){ toast('Escribe al menos una cantidad.'); return; }
    const neg=o=>{ const r={}; for(const k in o) r[k]=-o[k]; return r; };
    if(s.mov==='entrada'){ a=bod; const sm=document.getElementById('m-suma'); if(!sm || sm.checked) cambios[bod]=Object.assign({},piezas); }
    else if(s.mov==='carga'){ de=bod; a=loc; cambios[bod]=neg(piezas); cambios[loc]=Object.assign({},piezas); }
    else if(s.mov==='regreso'){ de=loc; a=bod; cambios[loc]=neg(piezas); cambios[bod]=Object.assign({},piezas); }
    if((s.mov==='carga'||s.mov==='regreso') && !s.forzar){
      const falt=faltantes(de,piezas);
      if(falt.length){
        s.forzar=true;
        document.getElementById('m-aviso').innerHTML=`<div class="aviso">No alcanza en ${esc(nombreLoc(de))}:<ul>${falt.map(f=>`<li>${esc(nombreProd(f.pid))}: hay ${f.hay}, quieres pasar ${f.pide}</li>`).join('')}</ul>Toca Guardar otra vez si quieres guardarlo así.</div>`;
        return;
      }
    }
  }
  const id=uid('m');
  const mov={id, hora:new Date().toISOString(), tipo:s.mov, de, a, piezas, cambios, nota:String(nota).trim()};
  let diaMov=S.hoy; const patch={movs:{[id]:mov}};
  if(s.mov==='entrada'){
    const el=document.getElementById('m-costo'); const c=(el && el.value.trim()!=='') ? num(el.value) : costoEntrada(piezas); mov.costo=Math.round(Math.max(0,c)*100)/100;
    const f=(document.getElementById('m-fecha')||{}).value; if(f && f<=S.hoy) diaMov=f;
    if(!cambios[bod]) mov.soloInversion=true;
    const env=num((document.getElementById('m-envio')||{}).value||0);
    if(env>0){ const gid=uid('g'); patch.gastos={[gid]:{id:gid, hora:mov.hora, concepto:'Envío del proveedor', monto:env, nota:'Compra del '+diaCorto(diaMov), compra:id}}; }
  }
  const msgs={entrada:'Mercancía agregada a bodega.',carga:'Carga guardada.',regreso:'Regreso guardado.',conteo:'Inventario corregido.'};
  const ok=await intentar(async()=>{ await escribirDia(diaMov, patch); await aplicar(cambios,1); }, s.mov==='entrada'&&mov.costo>0 ? (mov.soloInversion?'Inversión anotada · ':'Mercancía agregada · invertiste ')+fmt$(mov.costo) : msgs[s.mov]);
  if(ok) cerrarSheet();
}

    catch(e){ console.error(e); S.estado='error-acceso'; render(); return; }
  } else if(s.data().uid!==u.uid){
    let r=null; try{ r=await PM.db.fs.doc('users/'+u.uid).get(); }catch(e){ r=null; }
    S.estado=(r && r.exists && r.data().rol==='rep') ? 'es-rep' : 'sin-acceso'; render(); return;
  }
  S.db=PM.db;
  subColeccion('productos','prods'); subColeccion('promos','promos'); subColeccion('ubicaciones','ubic'); subColeccion('catalogoRep','cat');
  unsubs.push(S.db.collection('users').onSnapshot(sn=>{ const o={}; sn.docs.forEach(d=>{ o[d.id]=Object.assign({id:d.id}, d.data()); }); S.users=o; if(S.sheet && S.sheet.tipo==='ubic') renderSheet(); }, e=>console.warn('users', e)));
  subRepVentas();
  subDia('hoy'); subDia('hist');
  if(S.tab==='gan') subGan();
}
iniciar();
})();
</script>
